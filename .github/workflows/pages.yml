# main руу push хийх бүрт showcase/-ийг бүтээж GitHub Pages руу байршуулна.
# Нэг удаа: repo → Settings → Pages → Source: "GitHub Actions".

name: Showcase → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ойрхон хоёр push хийвэл хуучин байршуулалтыг цуцалж, сүүлийнхийг л үлдээнэ.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:showcase
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase-dist
      - id: deployment
        uses: actions/deploy-pages@v4
